<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAKSHAK AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .header {
            background: #991b1b;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

        #status {
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            background: #fee2e2;
        }

        .form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #b91c1c;
        }

        .alert {
            border-left: 6px solid #dc2626;
            background: #fef2f2;
            padding: 18px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .alert-title {
            font-weight: bold;
            font-size: 18px;
        }

        .time {
            color: #64748b;
            font-size: 13px;
            margin-top: 8px;
        }

    </style>

</head>


<body>

    <div class="header">

        <h1>🛡️ RAKSHAK AI</h1>

        <p>
            Real-Time Disaster Information & Emergency Response
        </p>

    </div>


    <div class="container">

        <div class="card">

            <h2>System Status</h2>

            <div id="status">
                🔴 Connecting...
            </div>

        </div>


        <div class="card">

            <h2>🚨 Test Disaster Alert</h2>

            <div class="form">

                <input
                    id="message"
                    placeholder="Example: Flood detected in Rasuwa"
                >

                <button onclick="sendAlert()">
                    SEND ALERT
                </button>

            </div>

        </div>


        <div class="card">

            <h2>Live Alerts</h2>

            <div id="alerts"></div>

        </div>

    </div>


<script>

const socket =
    new WebSocket("ws://127.0.0.1:8000/ws");


socket.onopen = function() {

    document.getElementById("status").innerHTML =
        "🟢 RAKSHAK AI — REAL-TIME CONNECTION ACTIVE";

};


socket.onmessage = function(event) {

    const alert = JSON.parse(event.data);

    const box =
        document.createElement("div");

    box.className = "alert";

    box.innerHTML = `

        <div class="alert-title">
            🚨 ${escapeHtml(alert.message)}
        </div>

        <div class="time">
            ${alert.timestamp}
            <br>
            Source: ${escapeHtml(alert.source)}
        </div>

    `;

    document
        .getElementById("alerts")
        .prepend(box);

};


socket.onerror = function() {

    document.getElementById("status").innerHTML =
        "❌ WebSocket connection error";

};


socket.onclose = function() {

    document.getElementById("status").innerHTML =
        "🔴 RAKSHAK AI connection closed";

};


function sendAlert() {

    const input =
        document.getElementById("message");

    const message =
        input.value.trim();


    if (!message) {

        alert("Enter a disaster alert.");

        return;

    }


    if (socket.readyState !== WebSocket.OPEN) {

        alert("RAKSHAK AI server is not connected.");

        return;

    }


    socket.send(message);

    input.value = "";

}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>

</html>
